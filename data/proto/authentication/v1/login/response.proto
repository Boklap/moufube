syntax = "proto3";

package authentication.v1.login;

option go_package="moufube.com/m/internal/generated/pb/authentication/v1/login;authenticationpb";

message Response {
    string message = 1;
    User user = 2;
    Tokens tokens = 3;
}

message User {
    string id = 1;
    bool is_verified = 2;
    string email = 3;
}

message Tokens {
    string access_token = 1;
    string refresh_token = 2;
}
